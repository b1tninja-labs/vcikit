name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Windows-only CI: the J2534 device target is Windows, so the suite runs on the real
# platform rather than Linux (the pure root crate still builds and tests fine there).
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  # The default `check` job builds only the root crate (no `--workspace`), so the J2534 backend
  # member has its own gate. It runs on Windows (its real target); the registry read and the DLL
  # FFI compile without a device attached.
  j2534:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p vcikit-j2534 --all-targets -- -D warnings
      - run: cargo test -p vcikit-j2534
      - run: cargo doc -p vcikit-j2534 --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test
      - run: cargo test -p vcikit-j2534
